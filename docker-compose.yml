services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hse
      POSTGRES_PASSWORD: hse
      POSTGRES_DB: hse_forms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hse -d hse_forms"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://hse:hse@db:5432/hse_forms
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change-me-in-prod-please
      TELEGRAM_BOT_TOKEN: ""
      CORS_ORIGINS: "*"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
