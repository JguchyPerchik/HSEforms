services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hse}
      POSTGRES_DB: hse_forms
    # Порт 5432 НЕ пробрасываем наружу: Postgres доступен только из
    # внутренней docker-сети. Для локального доступа используйте
    # `docker compose exec db psql ...` или временный override.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hse -d hse_forms"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 6379 тоже наружу не пробрасываем — Redis ходит только между сервисами.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://hse:${POSTGRES_PASSWORD:-hse}@db:5432/hse_forms
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod-please}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://hseforms.ru}
      UPLOAD_DIR: /data/uploads
    # ВНИМАНИЕ: в проде НЕ монтировать `./backend:/app` — иначе код в
    # контейнере подменяется файлами с хоста, образ становится бесполезным,
    # любая ошибка `git pull` мгновенно ломает прод. Раскомментируйте только
    # для локальной разработки.
    # volumes:
    #   - ./backend:/app
    volumes:
      - uploads:/data/uploads  # пользовательские картинки/PDF из опросов
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s  # alembic upgrade head может занять время

  bot:
    # Telegram-бот живёт отдельным контейнером. Наружу ничего не
    # пробрасывает — общается с Telegram Bot API через long-polling.
    # Нужен, чтобы Mini App открывался через web_app-кнопку (это
    # единственный способ получить themeParams и подписанные initData
    # в WebView). Без бота сайт можно открыть в Telegram, но он будет
    # рендериться без TG-темы и без авторизации пользователя.
    build: ./bot
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # Должен указывать на корень фронтенда (HTTPS обязателен —
      # Telegram не открывает web_app по http://).
      WEB_APP_URL: ${WEB_APP_URL:-https://hseforms.ru}
    depends_on:
      backend:
        condition: service_healthy
    # БД-зависимость пока не нужна — бот не пишет в Postgres напрямую.
    # Все привязки telegram_id → user_id делает бэкенд при первом
    # обращении Mini App с валидным initData.

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy  # ждём, пока бэк реально готов отвечать
    ports:
      - "80:80"      # нужен для ACME-challenge Let's Encrypt + редиректа на https
      - "443:443"
    volumes:
      # Монтируем Caddyfile — можно править домен и перезапускать без rebuild.
      - ./frontend/Caddyfile:/etc/caddy/Caddyfile:ro
      # Постоянное хранилище для сертификатов и метаданных Caddy. Без этого
      # при каждом `docker compose down/up` Caddy будет запрашивать у
      # Let's Encrypt новый сертификат и быстро упрётся в rate-limit.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  uploads:
