<!DOCTYPE html>
<html>

<head>
  <base href="/"> <meta charset="UTF-8">
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="HSE Forms — конструктор опросов НИУ ВШЭ">
  <meta name="theme-color" content="#0F2D69">

  <link rel="manifest" href="manifest.json">

  <style>
    @font-face {
      font-family: 'HSESans';
      src: url('assets/fonts/HSESans-Thin.otf') format('opentype');
      font-weight: 100;
      font-style: normal;
    }

    @font-face {
      font-family: 'HSESans';
      src: url('assets/fonts/HSESans-Regular.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
    }

    @font-face {
      font-family: 'HSESans';
      src: url('assets/fonts/HSESans-Italic.otf') format('opentype');
      font-weight: 400;
      font-style: italic;
    }

    @font-face {
      font-family: 'HSESans';
      src: url('assets/fonts/HSESans-SemiBold.otf') format('opentype');
      font-weight: 600;
      font-style: normal;
    }

    @font-face {
      font-family: 'HSESans';
      src: url('assets/fonts/HSESans-Bold.otf') format('opentype');
      font-weight: 700;
      font-style: normal;
    }

    @font-face {
      font-family: 'HSESans';
      src: url('assets/fonts/HSESans-Black.otf') format('opentype');
      font-weight: 900;
      font-style: normal;
    }
  </style>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <title>HSE Forms</title>
</head>

<body>
  <script>
    window.tgInitData = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp.initData : "";
    window.apiBase = 'https://hseforms.ru/api';

    // ─── Синхронизация темы Telegram → глобальный объект + событие ──────
    //
    // Mini App работает в WebView, унаследованном от темы клиента Telegram
    // (светлая/тёмная). По умолчанию Flutter Web этого не знает и рисует
    // приложение в своей фиксированной светлой теме — на тёмном Telegram
    // выглядит чужеродно. Здесь:
    //   1. Снимаем themeParams + colorScheme сразу при загрузке.
    //   2. Подписываемся на событие themeChanged Telegram'a — оно
    //      выстреливает, когда пользователь переключает тему клиента
    //      не закрывая Mini App. Перечитываем и диспатчим свой
    //      кастомный event 'tg-theme-changed' — его ловит Dart-сторона.
    function syncTgTheme() {
      var tg = window.Telegram && window.Telegram.WebApp;
      if (!tg) { return; }
      var p = tg.themeParams || {};
      // Раскладываем тему в ПЛОСКИЕ строковые свойства window — так
      // надёжнее, чем nested-объект: Dart js_interop стабильно читает
      // простые window.<key> через js_interop_unsafe.getProperty,
      // а вложенный JSObject требует дополнительного парсинга.
      window.tgBgColor          = p.bg_color || '';
      window.tgTextColor        = p.text_color || '';
      window.tgHintColor        = p.hint_color || '';
      window.tgLinkColor        = p.link_color || '';
      window.tgButtonColor      = p.button_color || '';
      window.tgButtonTextColor  = p.button_text_color || '';
      window.tgSecondaryBgColor = p.secondary_bg_color || '';
      window.tgHeaderBgColor    = p.header_bg_color || '';
      window.tgColorScheme      = tg.colorScheme || 'light';
      window.tgThemeReady       = true;
      console.log('[tg-theme] synced:', {
        scheme: window.tgColorScheme,
        bg: window.tgBgColor,
        text: window.tgTextColor,
        button: window.tgButtonColor,
      });
      try {
        window.dispatchEvent(new CustomEvent('tg-theme-changed'));
      } catch (e) { /* old browsers — fallback не нужен */ }

      // Дополнительно подкрашиваем НАТИВНЫЙ хром Telegram (верхнюю
      // плашку и фон под Mini App) — без этого заголовок остаётся
      // в дефолтном цвете клиента и визуально отстаёт от нашего
      // Flutter-рендера. Цвета берём те же, что отдал themeParams,
      // чтобы Mini App смотрелся как родной экран Telegram.
      try {
        var tg = window.Telegram.WebApp;
        // setHeaderColor поддерживает только 'bg_color' / 'secondary_bg_color'
        // как алиасы, либо #hex (с Bot API 6.9+). Безопасный путь — алиас.
        if (typeof tg.setHeaderColor === 'function') {
          tg.setHeaderColor('bg_color');
        }
        if (typeof tg.setBackgroundColor === 'function' && window.tgBgColor) {
          tg.setBackgroundColor(window.tgBgColor);
        }
      } catch (e) { /* старая версия клиента — просто пропускаем */ }
    }

    if (window.Telegram && window.Telegram.WebApp) {
      try {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
        syncTgTheme();
        window.Telegram.WebApp.onEvent('themeChanged', syncTgTheme);
        // На некоторых клиентах (особенно Android) themeParams приходят
        // не сразу — есть событие viewportChanged, после которого тема
        // уже точно есть. Перечитываем для надёжности.
        window.Telegram.WebApp.onEvent('viewportChanged', syncTgTheme);
      } catch (e) { }
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
