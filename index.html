<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <title>Forms</title>

  <!--
    ╔══════════════════════════════════════════════════════════════╗
    ║  TELEGRAM MINI APP SDK                                       ║
    ║  Must be loaded before Flutter bootstraps so that           ║
    ║  window.Telegram.WebApp is available on first frame.        ║
    ╚══════════════════════════════════════════════════════════════╝
  -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    /* Prevent flash of white before Flutter renders */
    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--tg-theme-bg-color, #ffffff);
      height: 100%;
      overflow: hidden;
    }

    /* Telegram Mini App: expand to full height */
    body {
      height: 100vh;
    }

    /* Loading indicator while Flutter initialises */
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--tg-theme-bg-color, #ffffff);
      transition: opacity 0.3s ease;
      z-index: 9999;
    }

    .loader-ring {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(99, 102, 241, 0.15);
      border-top-color: #6366F1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <!-- Loading screen -->
  <div id="loading">
    <div class="loader-ring"></div>
  </div>

  <script>
    // Expand to full screen as early as possible (before Flutter loads)
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.expand();
      window.Telegram.WebApp.ready();

      // Sync body background with Telegram theme immediately
      const bg = window.Telegram.WebApp.themeParams.bg_color;
      if (bg) document.documentElement.style.setProperty('--tg-bg', bg);
    }
  </script>

  <!-- Flutter Web bootstrap -->
  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Hide loading screen once Flutter is ready
    window.addEventListener('flutter-first-frame', () => {
      const el = document.getElementById('loading');
      if (el) {
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 400);
      }
    });
  </script>
</body>

</html>
